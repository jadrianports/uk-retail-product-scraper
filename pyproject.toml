[project]
name = "uk-retail-product-scraper"
version = "0.1.0"
description = "Capture product attributes for one category from UK retailer websites."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[project.scripts]
scrape = "scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
